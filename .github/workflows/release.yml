name: release

on:
  push:
    branches:
      - master
    tags:
      - "test-release"
      - "[0-9]+\\.[0-9]+"

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    steps:
      - name: create release
        uses: actions/create-release@v1
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-archlinux:
    name: build-archlinux
    needs: ["create-release"]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: install build tools
        run: pacman -Syu --noconfirm --needed base-devel git sudo
      - name: checkout code
        uses: actions/checkout@v4
      - name: build package
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder bash -c "cd \"$GITHUB_WORKSPACE\" && ./ci/build-arch-package.sh"
      - name: upload package to artifact
        uses: actions/upload-artifact@v6
        with:
          name: archlinux-package
          path: ci/corplink-rs-*.pkg.tar.zst
      - name: upload package to release
        uses: svenstaro/upload-release-action@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ci/corplink-rs-*.pkg.tar.zst
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  build-linux:
    name: build-linux
    needs: ["create-release"]
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22.0"
      - name: build package
        run: cargo build --release --locked
      - name: build tarball
        run: |
          cp target/release/corplink-rs .
          cp config.example.json config.json
          tar -czf corplink-rs-${{ github.ref_name }}-linux-$(uname -m).tar.gz corplink-rs config.json
      - name: upload tarball to artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-tarball
          path: corplink-rs-${{ github.ref_name }}*.tar.gz
      - name: upload tarball to release
        uses: svenstaro/upload-release-action@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: corplink-rs-${{ github.ref_name }}*.tar.gz
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  build-macos:
    name: build-macos
    needs: ["create-release"]
    runs-on: macos-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22.0"
      - name: build package
        run: cargo build --release
      - name: build tarball
        run: |
          cp target/release/corplink-rs .
          cp config.example.json config.json
          tar -czf corplink-rs-${{ github.ref_name }}-macos-$(uname -m).tar.gz corplink-rs config.json
      - name: upload package to artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-tarball
          path: corplink-rs-${{ github.ref_name }}*.tar.gz
      - name: upload package to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: corplink-rs-${{ github.ref_name }}*.tar.gz
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  build-windows:
    name: build-windows
    needs: ["create-release"]
    runs-on: windows-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22.0"
      - name: rust install gnu toolchain
        run: rustup toolchain install stable-gnu
      - name: rust use gnu toolchain
        run: rustup default stable-x86_64-pc-windows-gnu
      - name: build package
        run: cargo build --release
      - name: build check result
        run: |
          Move-Item -Path "target/release/corplink-rs.exe" -Destination "."
          Copy-Item -Path "config.example.json" -Destination "config.json"
          Copy-Item -Path "scripts/setup.ps1" -Destination "."
          Compress-Archive -Path corplink-rs.exe,config.json,setup.ps1 -Destination corplink-rs-${{ github.ref_name }}-windows.zip
      - name: upload package to artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-zip
          path: corplink-rs-${{ github.ref_name }}-windows.zip
      - name: upload package to release
        uses: svenstaro/upload-release-action@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: corplink-rs-${{ github.ref_name }}-windows.zip
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
